services:
  - type: web
    name: agastya-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALLOWED_ORIGINS
        value: https://agastya-fleet.netlify.app,http://localhost:5173
      - key: MAX_JOB_SECONDS
        value: 180
      - key: MAX_FLEET_SIZE
        value: 100
      - key: MAX_CONCURRENT_JOBS
        value: 3
      - key: RATE_LIMIT_PER_MINUTE
        value: 120
